# fly.toml app configuration file generated for entrenador-ia-backend on 2026-08-22T19:21:19+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'entrenador-ia-backend'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'

[deploy]
[env]
  ALLOWED_ORIGINS = 'https://<tu-frontend>.vercel.app,http://localhost:3000'
  DATABASE_URL = 'sqlite:////data/entrenador_ia.db'
  PORT = '8080'
  STATIC_DIR = '/data/static'
  STOCKFISH_PATH = '/usr/games/stockfish'

[[mounts]]
  source = 'sqlite_data'
  destination = '/data'

[[services]]
  protocol = 'tcp'
  internal_port = 8080

  [[services.ports]]
    port = 443
    handlers = ['http']
    force_https = true

  [[services.ports]]
    port = 80
    handlers = ['http']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
